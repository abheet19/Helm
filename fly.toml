# =============================================================================
# Helm — fly.toml
# Target app: helm-abheet  ->  https://helm-abheet.fly.dev
# Create + deploy with:  fly apps create helm-abheet && fly deploy
# =============================================================================
app = "helm-abheet"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Stay warm: an ops dashboard must respond instantly and keep its in-memory probe
  # history accumulating (a stopped machine cold-starts slow and resets history, which
  # showed as empty skeleton cards on first load). Same posture as Vantage.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
