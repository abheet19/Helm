<!doctype html>
<html lang="en" data-glass="helm">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Helm — Fleet Command Center</title>
  <meta name="description" content="Helm is a cross-project ops and observability command center: real health probes and alerts, clearly labelled sample Web Vitals and deploy history, dry-run action previews, and an ecosystem map in the glass design system." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0A0E12" />

  <!-- Reticle favicon, inline as a data URI (cyan-on-dark). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0E12'/%3E%3Cg fill='none' stroke='%234FE3E8' stroke-width='1.6'%3E%3Ccircle cx='16' cy='16' r='8.5'/%3E%3Cpath d='M16 2.5v6M16 23.5v6M2.5 16h6M23.5 16h6'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.1' fill='%234FE3E8'/%3E%3C/svg%3E" />

  <!-- glass design system: tokens first, then the component sheets, then the Helm theme. -->
  <link rel="stylesheet" href="/vendor/glass/tokens.css" />
  <link rel="stylesheet" href="/vendor/glass/primitives.css" />
  <link rel="stylesheet" href="/vendor/glass/navigation.css" />
  <link rel="stylesheet" href="/vendor/glass/feedback.css" />
  <link rel="stylesheet" href="/vendor/glass/data.css" />
  <link rel="stylesheet" href="/vendor/glass/forms.css" />
  <link rel="stylesheet" href="/vendor/glass/workspace.css" />
  <link rel="stylesheet" href="/vendor/glass/themes/helm.css" />
  <link rel="stylesheet" href="/styles.css?v=2" />

  <!-- Apply the saved appearance before first paint (no flash). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('helm.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('helm.flat') === '1') document.documentElement.setAttribute('data-flat', '1');
      } catch (e) {}
    })();
  </script>
</head>
<body class="glass-page glass-atmosphere">
  <div id="app" class="app-shell" aria-busy="true">
    <!-- app.js renders the rail, top bar and views here -->
  </div>
  <div id="toasts" class="toast-region" aria-live="polite" aria-atomic="false"></div>
  <div id="overlay-root"></div>

  <noscript>
    <p style="padding:2rem;color:#e6f1f5">Helm needs JavaScript to render the live fleet dashboard. The read-only APIs are still available at <code>/api/health</code>, <code>/api/fleet</code> and <code>/mcp/manifest.json</code>.</p>
  </noscript>

  <script type="module" src="/app.js?v=2"></script>
</body>
</html>
